<body>
    <h1>CALCULADORA DE CONSUMO</h1>

        <label for="opcao2">Alcool</label>

        <label for="opcao3">Diesel<label>
        <h3>INFORME A QUANTIDADE PERCORRIDA</h3>
        <input type="number" name="" id="inputKM">
        <h3>INFORME A QUANTIDADE DE LITROS DE COMBUSTIVEL CONSUMIDO</h3>
        <input type="number" name="" id="inputLT">
        <input type="button" name="" id="btnCalcular" value="CALCULAR" onclick="calcularConsumo()">

        </form>
    </div>
